<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 统筹面板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<style>
  :root {
    /* 仪表盘配色：瓷白面板 + 钴蓝操作 + 指示灯 */
    --bg: #eef1f5; --panel: #fbfcfe; --sub: #f3f5f9; --line: #dde2ea; --line-strong: #c9d0db;
    --text: #141b26; --muted: #5b6678; --faint: #8a94a6;
    --accent: #3048d8; --accent-2: #4a63ee; --accent-weak: #e9edfd; --accent-ring: rgba(48,72,216,.28);
    --ok: #15996a; --warn: #e39a1f; --bad: #e5484d; --grid: #cfd6e1;
    --shadow-sm: 0 1px 2px rgba(20,27,38,.05); --shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 1px 2px rgba(20,27,38,.05), 0 10px 28px -14px rgba(20,27,38,.18);
    --font-ui: "Segoe UI Variable Text", "Segoe UI", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, ui-monospace, monospace;
    --claude: #c2410c; --codex: #0f766e; --gemini: #2563eb; --grok: #3d4656; --deepseek: #4f46e5;
    --t-start: #15996a; --t-agent: #3048d8; --t-dev: #7a5af8; --t-human: #e39a1f; --t-end: #5b6678;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1218; --panel: #161c25; --sub: #121821; --line: #253040; --line-strong: #33415a;
      --text: #e6eaf0; --muted: #8b96a8; --faint: #66728a;
      --accent: #6e86ff; --accent-2: #8a9dff; --accent-weak: #1a2340; --accent-ring: rgba(110,134,255,.32);
      --ok: #33c48d; --warn: #f2b04a; --bad: #ff6b6f; --grid: #222c3a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35); --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.6);
      --claude: #fb923c; --codex: #2dd4bf; --gemini: #60a5fa; --grok: #cbd5e1; --deepseek: #a5b4fc; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 76px 1fr; grid-template-rows: 52px 1fr; }
  input, select, button, textarea { font: inherit; color: inherit; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  textarea { width: 100%; resize: vertical; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { color: var(--ok); } button.bad { color: var(--bad); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); }
  button.ghost { border-color: transparent; background: none; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .grow { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  .chip.ok { color: var(--ok); border-color: var(--ok); } .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.bad { color: var(--bad); border-color: var(--bad); } .chip.run { color: var(--accent); border-color: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .pulse { animation: pulse 1.2s infinite; } @keyframes pulse { 50% { opacity: .35; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .clamp2.open { display: block; }
  details.more > summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; margin-top: 6px; }
  details.more > summary::before { content: '▸ '; } details.more[open] > summary::before { content: '▾ '; }
  .agent-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
  .story .top { display: flex; gap: 8px; align-items: flex-start; }
  .story .num { font-size: 12px; color: var(--muted); padding-top: 1px; }
  .owner { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }

  /* 框架 */
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; display: flex; gap: 8px; align-items: center; }
  header h1 .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #7a5af8); color: #fff; display: grid; place-items: center; font-size: 14px; }
  nav { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
  nav button { width: 64px; border: 0; background: none; padding: 8px 0; border-radius: 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
  nav button .i { font-size: 18px; line-height: 1; }
  nav button.on { background: var(--accent-weak); color: var(--accent); }
  main { overflow: auto; position: relative; }
  .page { padding: 16px 20px 40px; display: grid; gap: 14px; max-width: 1600px; }

  /* 画布 */
  .wf { position: absolute; inset: 0; display: grid; grid-template-rows: 48px 1fr; }
  .wf-bar { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .canvas { position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 20px 20px; cursor: grab; }
  .canvas.panning { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  .edges path.e { fill: none; stroke: #98a2b3; stroke-width: 2; }
  .edges path.e.sel { stroke: var(--accent); stroke-width: 3; }
  .edges path.e.live { stroke: var(--accent); stroke-dasharray: 6 4; animation: dash 1s linear infinite; }
  .edges path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .node { position: absolute; width: 230px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.08); cursor: pointer; user-select: none; }
  .node:hover { box-shadow: 0 4px 12px rgba(16,24,40,.12); }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .node.s-running { border-color: var(--accent); } .node.s-waiting { border-color: var(--warn); } .node.s-failed { border-color: var(--bad); } .node.s-done { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .node.component { --tc: var(--accent); min-height: 156px; }
  .node.component .nb .component-why { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; line-height: 18px; }
  .node.component.s-running { animation: devStoryGlow 1.8s ease-in-out infinite; }
  .node.component.fresh { animation: componentIn .36s ease-out both; }
  .node.component.fresh.s-running { animation: componentIn .36s ease-out both, devStoryGlow 1.8s ease-in-out infinite; }
  @keyframes componentIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .component-json { margin: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sub); font: 12px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
  .component-summary { white-space: pre-wrap; overflow-wrap: anywhere; }
  .component-files { display: grid; gap: 7px; }
  .component-files button { text-align: left; white-space: normal; overflow-wrap: anywhere; }
  .component-task { display: grid; gap: 8px; margin-top: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .component-task h4 { margin: 0; font-size: 13px; }
  .component-task p { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .component-record { display: grid; gap: 8px; margin-bottom: 10px; }
  .component-record .row { align-items: flex-start; }
  .component-empty { padding: 24px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .node.component.fresh, .node.component.s-running { animation: none; } }
  .node .nh { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .node .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; flex: none; background: var(--tc); }
  .node .tt { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .nb { padding: 0 12px 10px; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .node .nb .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .h { position: absolute; top: 19px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
  .node .h.in { left: -8px; } .node .h.out { right: -8px; cursor: crosshair; }
  .node .h.out:hover { background: var(--accent); }
  .zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; }
  .menu { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,24,40,.15); padding: 6px; min-width: 220px; }
  .menu div { padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; } .menu div:hover { background: var(--accent-weak); }
  .menu .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 12px; background: var(--tc); }

  /* 开发看板：随画布缩放的 Story 泳道 */
  .dev-lanes { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); cursor: default; user-select: none; }
  .dev-lanes.fresh { animation: devLanesIn .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes devLanesIn { from { opacity: 0; transform: translateY(-8px); } }
  .dev-lanes-head { height: 48px; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); border-radius: 16px 16px 0 0; background: var(--sub); font-size: 12px; color: var(--muted); }
  .dev-lanes-head b { font-size: 13px; font-weight: 650; color: var(--text); }
  .dev-lanes-body { position: relative; }
  .dev-lane { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--c, var(--muted)) 4%, var(--panel)); border-top: 1px solid color-mix(in srgb, var(--c, var(--muted)) 12%, var(--line)); }
  .dev-lane-label { position: absolute; left: 0; top: 0; bottom: 0; width: 172px; padding: 15px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; border-right: 1px solid color-mix(in srgb, var(--c, var(--muted)) 16%, var(--line)); background: color-mix(in srgb, var(--c, var(--muted)) 4%, transparent); z-index: 2; }
  .dev-lane-name { max-width: 100%; font-size: 13px; font-weight: 650; color: var(--c, var(--muted)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-lane-model { max-width: 100%; font: 10.5px/1.5 var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-lane-running { font: 11px/1.5 var(--font-mono); color: var(--muted); }
  .dev-level { position: absolute; top: 0; height: 28px; width: 190px; padding: 6px 0; text-align: center; font: 10px/16px var(--font-mono); color: var(--faint); }
  .dev-story { position: absolute; width: 190px; height: 76px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; align-items: stretch; text-align: left; white-space: normal; background: var(--panel); border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 28%, var(--line)); border-left: 3px solid var(--c, var(--line-strong)); border-radius: 10px; box-shadow: var(--shadow-sm); z-index: 2; cursor: pointer; }
  .dev-story:hover:not(:disabled) { border-color: var(--c, var(--accent)); background: var(--panel); box-shadow: var(--shadow), 0 0 0 2px color-mix(in srgb, var(--c, var(--accent)) 10%, transparent); }
  .dev-story:active:not(:disabled) { transform: none; }
  .dev-story.sel { border-color: var(--accent); outline: 2px solid var(--accent-ring); outline-offset: 2px; }
  .dev-story.running { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); animation: devStoryGlow 1.8s ease-in-out infinite; }
  @keyframes devStoryGlow { 0%, 100% { box-shadow: var(--shadow-sm), 0 0 0 1px var(--accent-ring); } 50% { box-shadow: var(--shadow-sm), 0 0 16px 1px var(--accent-ring); } }
  .dev-story-top { display: flex; gap: 6px; align-items: center; min-width: 0; line-height: 14px; }
  .dev-story-num { font: 600 11px/14px var(--font-mono); color: var(--muted); margin-right: auto; }
  .dev-story-lamp { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dev-story-lamp.done { background: var(--ok); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 12%, transparent); }
  .dev-story-lamp.review { background: var(--warn); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 14%, transparent); }
  .dev-story-lamp.in-progress { background: var(--accent); animation: led 1.6s ease-in-out infinite; }
  .dev-story-rework, .dev-story-skills { font: 10px/14px var(--font-mono); flex: none; }
  .dev-story-rework { color: var(--bad); border-radius: 4px; padding: 0 3px; background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
  .dev-story-skills { color: var(--muted); }
  .dev-story-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; font-weight: 550; line-height: 17px; color: var(--text); }
  .dev-lane-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  .dev-dep { fill: none; stroke: color-mix(in srgb, var(--muted) 65%, transparent); stroke-width: 1.5; }
  .dev-dep.pending { stroke-dasharray: 5 4; }
  .dev-dep.live { stroke: var(--accent); stroke-dasharray: 6 4; animation: dash 1s linear infinite; }
  .dev-rework { fill: none; stroke: var(--bad); stroke-width: 1.3; stroke-dasharray: 4 3; }
  .dev-rework-label { fill: var(--bad); font: 600 10px/1 var(--font-mono); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
  .dev-handoff { fill: none; stroke: color-mix(in srgb, var(--muted) 38%, transparent); stroke-width: 1.3; stroke-dasharray: 3 5; pointer-events: stroke; cursor: help; }
  .dev-connector { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .dev-connector path { fill: none; stroke: color-mix(in srgb, var(--t-dev) 50%, var(--line)); stroke-width: 1.6; stroke-dasharray: 4 4; }
  .node .dev-lanes-toggle { margin-top: 4px; width: 100%; padding: 4px 8px; font-size: 12px; text-align: left; color: var(--accent); background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 18%, var(--line)); box-shadow: none; }
  .dev-lanes-hint { font-size: 11px; color: var(--muted); }
  .dev-story-side .lane-track { flex-direction: column; align-items: stretch; overflow-x: hidden; padding: 4px 0; gap: 3px; }
  .dev-story-side .lane-track .ev { width: 100%; min-width: 0; white-space: normal; }
  .dev-story-side .lane-track .ev .s { max-width: none; white-space: normal; }
  .dev-story-side .lane-track .arr { align-self: flex-start; margin-left: 12px; transform: rotate(90deg); line-height: 18px; }
  .dev-story-side .lane-track .arr.loop { transform: none; animation: none; }
  .dev-story-side .sk-rail { flex-wrap: wrap; min-width: 0; }
  .dev-story-side .skc { max-width: 100%; white-space: normal; overflow-wrap: anywhere; line-height: 1.4; }

  /* 右侧节点面板 */
  /* Story 流程（泳道） */
  .flow { overflow: auto; padding: 14px 18px 60px; }
  .flow-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .lane { display: grid; grid-template-columns: 290px 1fr; gap: 14px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; transition: box-shadow .18s; }
  .lane:hover { box-shadow: 0 4px 14px rgba(16,24,40,.07); }
  .lane.rw { border-left: 3px solid var(--bad); }
  .lane-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .lane-head .ttl { flex-basis: 100%; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-head .num { font-size: 12px; color: var(--muted); }
  .lane-track { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 4px 2px 6px; }
  .ev { display: inline-flex; flex-direction: column; gap: 1px; padding: 5px 10px; border-radius: 10px; border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); background: var(--sub); white-space: nowrap; font-size: 12px; flex: none; transition: box-shadow .15s, transform .15s; }
  .ev[data-run] { cursor: pointer; } .ev[data-run]:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(16,24,40,.12); }
  .ev .t { font-weight: 600; } .ev .s { color: var(--muted); font-size: 11px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .ev.bad { background: color-mix(in srgb, var(--bad) 9%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); border-left-color: var(--bad); }
  .ev.ok { background: color-mix(in srgb, var(--ok) 9%, var(--panel)); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); border-left-color: var(--ok); }
  .ev.warn { background: color-mix(in srgb, var(--warn) 9%, var(--panel)); border-left-color: var(--warn); }
  .ev.run { animation: glow 1.8s ease-in-out infinite; }
  .ev.new { animation: chipIn .3s cubic-bezier(.2,.8,.2,1) both; }
  .ev.new.run { animation: chipIn .3s cubic-bezier(.2,.8,.2,1) both, glow 1.8s ease-in-out .3s infinite; }
  @keyframes chipIn { from { opacity: 0; transform: translateX(-8px) scale(.96); } }
  .arr { color: var(--muted); font-size: 13px; padding: 0 1px; flex: none; }
  .arr.loop { color: var(--bad); font-weight: 700; font-size: 16px; animation: spinIn .5s ease-out both; }
  @keyframes spinIn { from { transform: rotate(-180deg); opacity: 0; } }
  .badge-r { display: inline-grid; place-items: center; min-width: 18px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; padding: 0 5px; margin-left: 4px; }
  .mini { font-size: 12px; display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .mini .ic2 { letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side { position: absolute; top: 48px; right: 0; bottom: 0; width: 400px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; box-shadow: -8px 0 24px rgba(16,24,40,.06); overflow-wrap: anywhere; }
  .side .sb > * { min-width: 0; }
  .side .sh { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .side .sb { padding: 14px 16px; display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; } .field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .skills-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .skills-chips .chip { color: var(--text); }
  .runbox { background: var(--sub); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; }
  .liveline { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 看板 */
  .agents { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .agent { border-left: 4px solid var(--c); padding: 10px 12px; } .agent .name { font-weight: 600; color: var(--c); }
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .col { background: var(--sub); border-radius: 12px; padding: 8px; min-height: 120px; }

  .sk { display: grid; gap: 6px; align-content: start; }
  .sk .nm { font-weight: 600; } .sk .ds { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; } .tabs button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }

  /* 通用 */

  .st-running { color: var(--accent); } .st-finished { color: var(--ok); } .st-failed { color: var(--bad); } .st-cancelled, .st-queued { color: var(--muted); }
  /* 网页终端 */
  .term { position: fixed; left: 76px; right: 0; bottom: 0; height: 44vh; background: var(--panel); color: var(--text); border-top: 1px solid var(--line-strong);
    box-shadow: 0 -16px 40px rgba(0,0,0,.28); transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.8,.2,1), height .25s ease; z-index: 15;
    display: grid; grid-template-rows: 38px minmax(0, 1fr) 28px; font: 12.5px/1.6 var(--font-mono); }
  .term.open { transform: translateY(0); } .term.max { height: 82vh; }
  body.term-open main { padding-bottom: 44vh; }
  .term-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--sub); border-bottom: 1px solid var(--line); overflow-x: auto; font: 12px var(--font-ui); }
  .term-tab { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px 8px 0 0; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background .18s, color .18s; position: relative; }
  .term-tab:hover { color: var(--text); } .term-tab.on { background: var(--panel); color: var(--text); }
  .term-tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--tc, #58a6ff); }
  .term-tab .x { opacity: 0; transition: opacity .15s; padding: 0 2px; } .term-tab:hover .x { opacity: .6; } .term-tab .x:hover { opacity: 1; }
  .term-tab .st { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; }
  .term-tab .st.run { background: #3fb950; box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: ping 1.6s infinite; }
  .term-tab .st.ok { background: #3fb950; } .term-tab .st.bad { background: #f85149; }
  .term-tab.flash { animation: tabflash .9s ease 2; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.55); } 70% { box-shadow: 0 0 0 7px rgba(63,185,80,0); } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); } }
  @keyframes tabflash { 50% { background: rgba(88,166,255,.25); } }
  .term-tools { margin-left: auto; display: flex; flex: none; align-items: center; gap: 4px; padding-bottom: 5px; position: sticky; right: 0; background: var(--sub); }
  .term-tools button, .term-input { background: none; border: 0; color: var(--muted); padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
  .term-tools button:hover { background: var(--accent-weak); color: var(--text); }
  .term-input { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .term-input input { margin: 0; accent-color: var(--warn); }
  .term-input.on, .term-input-badge { color: var(--warn); font-weight: 600; }
  .term-input-badge { font-size: 10px; }
  .term-body { overflow: hidden; min-height: 0; padding: 8px 12px; position: relative; }
  .term-body .tb { display: none; height: 100%; min-width: 0; } .term-body .tb.on { display: block; }
  .term-body .xterm { height: 100%; }
  .term-foot { display: flex; gap: 14px; align-items: center; padding: 0 14px; background: var(--sub); border-top: 1px solid var(--line); color: var(--muted); font: 11.5px var(--font-ui); overflow: hidden; white-space: nowrap; }
  .term-foot .liveline { min-width: 0; font-family: var(--font-mono); }
  .term-empty { color: var(--muted); padding: 30px; text-align: center; font-family: var(--font-ui); }
  @media (prefers-color-scheme: dark) { .term, .term-tab.on { background: #0e1218; } }
  #termBtn .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; margin-left: 4px; padding: 0 5px; }
  /* 动效 */
  .page.enter { animation: fadeUp .26s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .node { transition: box-shadow .2s, border-color .2s, transform .15s; }
  .node.s-running { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 1px 3px rgba(16,24,40,.08); } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), 0 8px 22px rgba(21,94,239,.16); } }
  .card.story { transition: transform .16s ease, box-shadow .16s ease; } .card.story:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16,24,40,.08); }
  .card.story.running { animation: glow 1.8s ease-in-out infinite; }
  .chip, .seg button, nav button, button { transition: background .18s, color .18s, border-color .18s, box-shadow .18s; }
  dialog[open] { animation: pop .2s cubic-bezier(.2,.8,.2,1); } @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .toast { animation: toastIn .25s cubic-bezier(.2,.8,.2,1); } @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
  .liveline { transition: color .2s; }
  dialog { width: min(1040px, 94vw); max-height: 88vh; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; }
  dialog.narrow { width: min(600px, 94vw); } dialog::backdrop { background: rgba(16,24,40,.45); }
  .dlg-head { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .dlg-body { padding: 14px 16px; overflow: auto; max-height: calc(88vh - 58px); }
  pre.log { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .diff div { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; padding: 0 6px; }
  .diff .a { background: color-mix(in srgb, var(--ok) 15%, transparent); } .diff .d { background: color-mix(in srgb, var(--bad) 15%, transparent); } .diff .h { color: var(--muted); }
  .form { display: grid; gap: 10px; } .form label { display: grid; gap: 4px; font-size: 13px; }
  .fs-list { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .fs-list div { padding: 5px 10px; cursor: pointer; border-bottom: 1px solid var(--line); } .fs-list div:hover { background: var(--accent-weak); }
  .settings-agent { border-left: 4px solid var(--c); margin-bottom: 12px; }
  .settings-shell { display: grid; gap: 16px; }
  .settings-intro { margin: 0; color: var(--muted); font-size: 12px; }
  .provider-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; min-height: 460px; }
  .provider-sidebar { display: flex; flex-direction: column; gap: 10px; padding-right: 16px; border-right: 1px solid var(--line); }
  .provider-list { display: grid; gap: 5px; align-content: start; flex: 1; }
  .provider-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px; text-align: left; white-space: normal; box-shadow: none; background: transparent; border-color: transparent; }
  .provider-item.on { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .provider-item .dot { flex: none; }

  .provider-detail { display: grid; gap: 14px; align-content: start; min-width: 0; }

  .provider-detail .row input { width: auto; }

  .provider-detail label.row, .settings-agent label.row { display: flex; gap: 6px; align-items: center; }
  .provider-feedback { padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--sub); font-size: 12px; overflow-wrap: anywhere; }
  .provider-feedback.ok { color: var(--ok); } .provider-feedback.bad { color: var(--bad); }

  .settings-auth-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toast { position: fixed; right: 16px; bottom: 16px; padding: 10px 14px; border-radius: 10px; max-width: 460px; display: none; color: #fff; z-index: 20; }
  .welcome { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 900px; margin: 60px auto; }

  @media (max-width: 1100px) { .agents, .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .welcome { grid-template-columns: 1fr; } .side { width: min(400px, 90vw); } }

  /* ================= 主题 v2：仪表盘 ================= */
  body { font-family: var(--font-ui); font-size: 14px; letter-spacing: .005em; -webkit-font-smoothing: antialiased;
    background: radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%), var(--bg); }
  h1, h2, h3, .page h2 { font-family: var(--font-display); letter-spacing: -.01em; }
  .page h2 { font-size: 20px; font-weight: 650; }
  ::selection { background: var(--accent-ring); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .num, .badge, [data-since], [data-ago], table.list td:nth-child(5) { font-variant-numeric: tabular-nums; }

  /* 输入与按钮 */
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; transition: border-color .15s, box-shadow .15s; }
  input:hover, select:hover, textarea:hover { border-color: var(--line-strong); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  button { border-radius: 9px; padding: 7px 13px; font-weight: 500; box-shadow: var(--shadow-sm); transition: background .15s, border-color .15s, box-shadow .15s, transform .12s, color .15s; }
  button:hover:not(:disabled) { border-color: var(--line-strong); background: color-mix(in srgb, var(--panel) 85%, var(--accent-weak)); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-color: color-mix(in srgb, var(--accent) 80%, black); color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 1px 2px rgba(20,27,38,.15), 0 6px 14px -6px var(--accent-ring); }
  button.primary:hover:not(:disabled) { background: linear-gradient(180deg, var(--accent-2), color-mix(in srgb, var(--accent) 90%, black)); border-color: color-mix(in srgb, var(--accent) 70%, black); }
  button.ghost, button.link { box-shadow: none; }
  button.link:hover:not(:disabled) { background: none; text-decoration: underline; text-underline-offset: 3px; }
  button.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
  button.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }
  .seg { border-radius: 10px; padding: 2px; gap: 2px; background: var(--sub); border-color: var(--line); }
  .seg button { border-radius: 8px; box-shadow: none; padding: 5px 12px; color: var(--muted); background: none; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
  .seg button.on::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  /* 指示灯式状态标签 */
  .chip { border-radius: 999px; padding: 2px 9px; font-size: 12px; gap: 6px; background: var(--panel); border-color: var(--line); color: var(--muted); font-weight: 500; }
  .chip.ok, .chip.warn, .chip.bad, .chip.run { border-color: var(--line); color: var(--text); }
  .chip.ok::before, .chip.warn::before, .chip.bad::before, .chip.run::before { content: ''; width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.ok::before { background: var(--ok); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 18%, transparent); }
  .chip.warn::before { background: var(--warn); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 22%, transparent), 0 0 8px var(--warn); }
  .chip.bad::before { background: var(--bad); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 20%, transparent), 0 0 8px var(--bad); }
  .chip.run::before { background: var(--accent); animation: led 1.6s ease-in-out infinite; }
  @keyframes led { 0%, 100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 10%, transparent), 0 0 10px var(--accent); } }
  .dot { box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 0%, transparent); }

  /* 卡片 */
  .card { border-radius: 14px; border-color: var(--line); box-shadow: var(--shadow); padding: 16px 18px; }
  .box { border-radius: 10px; background: var(--sub); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }

  /* 顶栏 */
  header { background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); gap: 12px; padding: 0 18px; z-index: 6; }
  header h1 { font-size: 15px; font-weight: 650; gap: 10px; }
  header h1 .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, #1d2a6b, var(--accent)); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 4px 12px -4px var(--accent-ring); }
  header h1 .logo svg { width: 18px; height: 18px; }
  header h1 .tag { font: 600 10px/1 var(--font-mono); letter-spacing: .14em; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; }
  header select#projectSel { font-weight: 600; background: var(--sub); }
  #termBtn, #leaderSkills { display: inline-flex; align-items: center; gap: 6px; }
  #termBtn svg, #leaderSkills svg { width: 15px; height: 15px; }
  #leaderBox { gap: 6px; color: var(--muted); }

  /* 侧栏 + 团队指示灯 */
  nav { padding: 12px 0 14px; gap: 2px; background: color-mix(in srgb, var(--panel) 88%, transparent); }
  nav button { position: relative; width: 62px; padding: 9px 0 7px; border-radius: 11px; gap: 4px; font-size: 11.5px; box-shadow: none; color: var(--muted); }
  nav button:hover:not(:disabled) { background: var(--sub); color: var(--text); border-color: transparent; }
  nav button .i { display: grid; place-items: center; }
  nav button .i svg { width: 20px; height: 20px; }
  nav button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  nav button.on::before { content: ''; position: absolute; left: -7px; top: 50%; width: 3px; height: 22px; margin-top: -11px; border-radius: 0 3px 3px 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .crew { margin-top: auto; display: grid; gap: 7px; justify-items: center; padding-top: 12px; border-top: 1px solid var(--line); width: 52px; }
  .crew .lbl { font: 600 9px/1 var(--font-mono); letter-spacing: .18em; color: var(--faint); }
  .lamp { position: relative; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font: 650 11px/1 var(--font-mono); letter-spacing: .02em;
    color: color-mix(in srgb, var(--c) 85%, var(--text)); background: color-mix(in srgb, var(--c) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); cursor: default; transition: box-shadow .3s, opacity .3s; }
  .lamp::after { content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); border: 2px solid var(--panel); }
  /* CREW authentication state stays visible even while a task is running. */
  .crew .lamp { padding: 0; gap: 0; cursor: pointer; }
  .crew .lamp:hover:not(:disabled) { color: color-mix(in srgb, var(--c) 85%, var(--text)); background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .crew .lamp.available::after { background: var(--ok); }
  .crew .lamp.unverified { border-style: dashed; border-color: var(--line-strong); }
  .crew .lamp.unverified::after { background: var(--faint); }
  .crew .lamp.invalid::after { background: var(--bad); }
  .lamp.busy { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent), 0 0 18px -2px color-mix(in srgb, var(--c) 55%, transparent); }
  .lamp.busy::after { background: var(--ok); animation: lampGlow 1.4s ease-in-out infinite; }
  .lamp.off { opacity: .38; filter: grayscale(1); }
  .lamp.leader { outline: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
  .crew .lamp:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @keyframes lampGlow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 50% { box-shadow: 0 0 0 5px transparent, 0 0 10px var(--ok); } }
  @media (prefers-reduced-motion: reduce) { .crew .lamp.busy::after { animation: none; } }

  /* 页面 */
  .page { padding: 20px 24px 48px; gap: 16px; }
  .agents { gap: 12px; }
  .agent-chip { padding: 5px 11px 5px 9px; border-color: var(--line); box-shadow: var(--shadow-sm); }
  .board { gap: 12px; }

  if ($('settingsShell') && settingsTab === 'providers') renderSettings();
}
window.checkProvider = button => settingsAction(button, async () => {
  const id = await persistProvider();
  const result = await api('/api/providers/check', { id });
  await refreshProviderDetails(id); toast(result.ok ? `检查通过 · ${result.count} 个模型` : result.error || '检查失败', result.ok ? 'ok' : undefined);
});
window.fetchProviderModels = button => settingsAction(button, async () => {
  const id = await persistProvider();
  try { await api('/api/providers/models', { id }); }
  finally { await refreshProviderDetails(id); }
  if ($('providerModelList')) $('providerModelList').open = true; toast('模型列表已更新', 'ok');
});
window.deleteProvider = button => settingsAction(button, async () => {
  const p = SETTINGS.providers.find(x => x.id === SETTINGS.providerId);
  if (!p || p.builtin) throw new Error('内置服务商不可删除');
  if (SETTINGS.agents.some(a => a.auth?.mode === 'provider' && a.auth.provider === p.id)) throw new Error('服务商正在被 Agent 使用，请先切换认证方式');
  if (!confirm(`删除服务商「${p.name}」？`)) return;
  await api('/api/providers/delete', { id: p.id });
  SETTINGS.providers = await api('/api/providers'); delete SETTINGS.providerDrafts[p.id]; SETTINGS.providerId = SETTINGS.providers[0]?.id || '__new'; renderSettings(); toast('服务商已删除', 'ok');
});
function providerCompatibility(a, p) {
  const types = a.providerTypes || AGENT_PROVIDER_TYPES[a.id] || [];
  if (a.providerSupported === false || !types.length) return a.providerNote || '此 CLI 使用自身配置，暂不支持服务商';
  if (!types.includes(p.type)) return `不兼容：仅支持 ${types.join(' / ')}`;
  if (!p.enabled) return '服务商已停用';
  return '';
}
function agentsSettingsView() {
  const g = SETTINGS.global;
  return `<p class="settings-intro">官方账号使用 CLI 自己的登录；服务商模式使用面板统一配置的地址、Key 和模型。</p><div>${SETTINGS.agents.map(settingsCard).join('')}</div>
    <details class="settings-global"><summary>面板与任务设置</summary><div class="form"><div class="grid2"><label>同时运行的任务数<select id="setPar" title="Leader 会保证同时跑的任务不改同一批文件">${[1, 2, 3, 4, 5].map(n => `<option ${g.maxParallel === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label><label>自动模式最多打回几轮<select id="setRounds">${[1, 2, 3, 4, 5].map(n => `<option ${g.maxRounds === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div><label>卡住检测时长（分钟）<input id="setStallMinutes" type="number" min="0.01" step="any" value="${esc(g.stallMinutes ?? 10)}"><span class="small muted">持续没有新输出，或只重复同一行达到此时长后提醒；每 30 秒检查一次。</span></label><label>新项目默认放在<input id="setRoot" value="${esc(g.projectsRoot)}"></label><div class="row"><span class="grow"></span><button onclick="saveGlobal(this)">保存面板设置</button></div></div></details>`;
}
function loginSettingsView(a) {
  const login = a.login || {}, status = login.status;
  const label = { 'logged-in': '已登录', expired: '登录已失效', unverified: '凭据存在，未验证', self: '使用自身配置' }[status] || '未登录';
  const tone = status === 'logged-in' ? 'ok' : status === 'expired' ? 'bad' : status === 'not-logged-in' ? 'warn' : '';
  return `<div class="settings-login" id="login-${esc(a.id)}"><div class="row"><span class="chip ${tone}">${label}</span>${login.canLogin ? `<button ${a.installed ? '' : 'disabled'} onclick="loginAgent('${jsq(a.id)}',this)">登录</button>` : ''}${status === 'unverified' ? `<button ${a.installed ? '' : 'disabled'} onclick="testAgent('${jsq(a.id)}',this)">测连通</button>` : ''}<button onclick="refreshLogin('${jsq(a.id)}',this)">刷新状态</button>${login.testedAt ? `<span class="small muted">最近测试：${esc(new Date(login.testedAt).toLocaleString())}</span>` : ''}</div><div class="small muted">${esc(login.hint || (status === 'self' ? '使用 CLI 自身配置。' : '登录状态根据凭据文件与官方账号最近一次测连通结果判断。'))}${login.command ? `<br>登录命令：<code>${esc(login.command)}</code>` : ''}</div></div>`;
}
function settingsCard(a) {
  const d = agentSettingsDraft(a), auth = d.auth, t = a.test, providerMode = auth.mode === 'provider';
  const types = a.providerTypes || AGENT_PROVIDER_TYPES[a.id] || [], supported = a.providerSupported !== false && types.length > 0;
  const p = SETTINGS.providers.find(x => x.id === auth.provider), reason = p ? providerCompatibility(a, p) : '';
  const modelInput = `<label>模型${providerMode ? ` <span class="small muted">${(p?.models || []).length} 个缓存模型，可手填</span>` : '（可选）'}<input id="model-${esc(a.id)}" list="ml-${esc(a.id)}" value="${esc(auth.model)}" placeholder="${providerMode ? '选择或输入模型 ID' : '留空使用 CLI 默认模型'}" autocomplete="off"><datalist id="ml-${esc(a.id)}">${(p?.models || []).map(m => `<option value="${esc(m)}">`).join('')}</datalist></label>`;
  return `<div class="card settings-agent" style="--c:${color(a.id)}" id="set-${esc(a.id)}"><div class="row"><b style="color:${color(a.id)}">${esc(a.name)}</b><span class="chip ${a.installed ? 'ok' : 'bad'}">${a.installed ? '已安装' : '未安装'}</span><label class="row small"><input type="checkbox" id="en-${esc(a.id)}" ${d.enabled ? 'checked' : ''}> 启用</label><span class="grow"></span><span class="small" id="test-${esc(a.id)}">${testLabel(t)}</span></div>
    <div class="small muted">${esc(a.path || a.cmd)}</div><div class="settings-auth"><div class="settings-auth-head"><span>认证方式</span><div class="seg"><button class="${!providerMode ? 'on' : ''}" onclick="setAgentAuth('${jsq(a.id)}','official')">官方账号</button><button class="${providerMode ? 'on' : ''}" ${supported ? '' : `disabled title="${esc(a.providerNote || '此 CLI 暂不支持服务商，使用自身配置')}"`} onclick="setAgentAuth('${jsq(a.id)}','provider')">服务商</button></div></div>
    ${providerMode ? `<div class="grid2"><label>服务商<select id="provider-${esc(a.id)}" onchange="setAgentProvider('${jsq(a.id)}',this.value)"><option value="">选择服务商…</option>${SETTINGS.providers.map(x => { const why = providerCompatibility(a, x); return `<option value="${esc(x.id)}" ${x.id === auth.provider ? 'selected' : ''} ${why ? 'disabled' : ''}>${esc(x.name)}${why ? '（' + esc(why) + '）' : ''}</option>`; }).join('')}</select></label>${modelInput}</div>${reason ? `<div class="settings-error">${esc(reason)}</div>` : ''}<div class="row"><span class="small muted">${p ? esc(p.baseUrl) : '先在服务商页添加、启用并设置 Key。'}</span><span class="grow"></span><button class="link" onclick="setSettingsTab('providers')">管理服务商</button></div>` : `${loginSettingsView(a)}${a.canModel ? modelInput : ''}${!supported ? `<div class="small muted">${esc(a.providerNote || a.modelNote || '此 CLI 使用自身配置，暂不支持服务商。')}</div>` : ''}`}
    </div><div class="grid2" style="margin-top:12px"><label>权限<select id="perm-${esc(a.id)}">${(a.permOptions || ['max', 'safe']).map(o => `<option value="${esc(o)}" ${d.permission === o ? 'selected' : ''}>${o === 'max' ? '最高（无审批、无沙箱，测试电脑用）' : '标准（自动改文件，危险命令拦截）'}</option>`).join('')}</select></label><label>特长（Leader 分配时参考）<input id="str-${esc(a.id)}" value="${esc(d.strengths)}"></label></div><div class="row settings-save-row"><span class="small muted">当前模型：${esc(a.effectiveModel || 'CLI 默认')}</span><span class="grow"></span><button ${a.installed ? '' : 'disabled'} onclick="testAgent('${jsq(a.id)}',this)">测连通</button><button class="primary" onclick="saveAgent('${jsq(a.id)}',this)">保存</button></div><div id="test-output-${esc(a.id)}">${agentTestOutput(t)}</div></div>`;
}
window.setAgentAuth = (id, mode) => {
  captureSettings(); const a = SETTINGS.agents.find(x => x.id === id), d = agentSettingsDraft(a);
  if (mode === 'provider' && (a.providerSupported === false || !(a.providerTypes || AGENT_PROVIDER_TYPES[id] || []).length)) return;
  d.auth.mode = mode;
  if (mode === 'provider' && !SETTINGS.providers.some(p => p.id === d.auth.provider && !providerCompatibility(a, p))) d.auth.provider = SETTINGS.providers.find(p => !providerCompatibility(a, p))?.id || '';
  renderSettings();
};
window.setAgentProvider = (id, provider) => { captureSettings(); agentSettingsDraft(SETTINGS.agents.find(a => a.id === id)).auth.provider = provider; renderSettings(); };
const testLabel = t => !t ? '' : t.status === 'running' ? '<span class="pulse">测试中…</span>' : (t.status === 'ok' ? `<span style="color:var(--ok)">✓ 通 · ${fmtDur(t.ms)}</span>` : `<span style="color:var(--bad)">✗ ${t.status === 'timeout' ? '超时' : '失败'}</span>`) + (t.finishedAt ? `<span class="muted"> · ${esc(new Date(t.finishedAt).toLocaleString())}</span>` : '') + (t.persistenceError ? `<span style="color:var(--bad)" title="${esc(t.persistenceError)}"> · 结果未保存，请重测</span>` : '');
const agentTestOutput = t => t?.output && t.status !== 'ok' ? `<details><summary class="small">测连通输出</summary><pre class="log">${esc(t.output)}</pre></details>` : '';
window.saveGlobal = button => settingsAction(button, async () => { captureSettings(); const g = SETTINGS.global; if (!Number.isFinite(g.stallMinutes) || g.stallMinutes <= 0) throw new Error('卡住检测时长必须大于 0 分钟'); S = await api('/api/settings', { maxParallel: g.maxParallel, projectsRoot: g.projectsRoot.trim(), stallMinutes: g.stallMinutes }); if (S.project) S = await api('/api/mode', { maxRounds: g.maxRounds }); renderTop(); toast('面板设置已保存', 'ok'); });
async function persistAgent(id) {
  captureSettings(); const a = SETTINGS.agents.find(x => x.id === id), d = agentSettingsDraft(a);
  if (d.auth.mode === 'provider') { const p = SETTINGS.providers.find(x => x.id === d.auth.provider); if (!p) throw new Error('请选择服务商'); const why = providerCompatibility(a, p); if (why) throw new Error(why); }
  const patch = { ...d, auth: { ...d.auth, model: d.auth.model.trim() } };
  await api('/api/agents/save', { id, patch });
  SETTINGS.agents = await api('/api/agents'); delete SETTINGS.agentDrafts[id]; await refreshSettingsState();
}
window.saveAgent = (id, button) => settingsAction(button, async () => { await persistAgent(id); if ($('settingsShell')) renderSettings(); toast('Agent 已保存', 'ok'); });
window.testAgent = (id, button) => settingsAction(button, async () => { await persistAgent(id); await api('/api/agents/test', { id }); const el = $('test-' + id); if (el) el.innerHTML = testLabel({ status: 'running' }); toast('已按当前认证方式开始测试', 'ok'); });
window.refreshLogin = (id, button) => settingsAction(button, async () => { const login = await api('/api/agents/login-status' + q({ id })); const a = SETTINGS.agents.find(x => x.id === id); a.login = login; const el = $('login-' + id); if (el) el.outerHTML = loginSettingsView(a); });
window.loginAgent = (id, button) => settingsAction(button, async () => { await persistAgent(id); const result = await api('/api/agents/login', { id }); toast(result.hint || '登录窗口已打开，完成后点击「刷新状态」', 'ok'); });

// ================= 实时更新 =================
const es = new EventSource('/api/events');
let pending = null;
es.addEventListener('schedule', e => {
  const event = JSON.parse(e.data);
  if (S && Number.isFinite(Number(event.runningCount))) S.scheduleRunningCount = Number(event.runningCount);
  renderScheduleIndicator(); renderCrew();
  if (event.phase === 'started') toast(`定时任务“${event.name}”开始运行`, 'ok');
  else if (event.phase === 'finished') toast(`定时任务“${event.name}”已结束${event.result ? '：' + event.result : ''}`, /失败|failed|error/i.test(event.result || '') ? 'bad' : 'ok');
  else if (event.phase === 'skipped') toast(`定时任务“${event.name}”跳过：上次未完成`);
  if (page === 'schedules') renderSchedules();
});
es.addEventListener('devtask', e => {
  const event = JSON.parse(e.data);
  mergeDevtask(event.run, event.runningCount);
  renderDevtaskIndicator(); renderCrew(); renderDevtasks(); termSync();
});
es.addEventListener('run', e => {
  const { run } = JSON.parse(e.data);
  if (!run?.id) return;
  const current = findRun(run.id);
  if (current) Object.assign(current, run);
  for (const tab of TERM.tabs) if (tab.id === run.id) Object.assign(tab.run, run);
  if (current && page === 'runs') renderPage();
  termSync();
});
es.addEventListener('system-proxy', e => {
  const proxy = JSON.parse(e.data), previous = S?.systemProxy;
  if (S) S.systemProxy = proxy;
  renderSystemProxyWarning();
  if (proxy.unavailable && (!previous?.unavailable || previous.endpoint !== proxy.endpoint)) toast(proxy.message || `系统代理 ${proxy.endpoint || ''} 不可用`, 'bad');
  else if (previous?.unavailable && !proxy.unavailable) toast('系统代理已恢复可用', 'ok');
});
es.addEventListener('stall', e => {
  const event = JSON.parse(e.data), current = findRun(event.id);
  const update = { ...(event.run || {}), id: event.id, stalled: event.stalled, stalledReason: event.stalledReason || '' };
  if (event.kind === 'devtask' || current?.kind === 'devtask') mergeDevtask(update);
  else if (current) Object.assign(current, update);
  for (const tab of TERM.tabs) if (tab.id === event.id) Object.assign(tab.run, update);
  const run = findRun(event.id) || event.run;
  renderDevtaskIndicator();
  if (page === 'runs') renderPage();
  termSync();
  if (event.stalled) toast(`${run?.title || agentName(run?.agent) || event.id}：${event.stalledReason || '疑似卡住'}`, 'warn');
  else if (run?.status === 'running') toast(`${run?.title || event.id} 已恢复输出`, 'ok');
});
// EventSource reconnects do not replay missed log chunks; fill from the file.
es.addEventListener('open', () => { for (const tab of TERM.tabs) termReload(tab); if (S) refresh().then(termSync).catch(() => {}); });
es.addEventListener('state', () => { clearTimeout(pending); pending = setTimeout(() => refresh().then(termSync).catch(() => {}), 250); });
es.addEventListener('log', e => {
  const event = JSON.parse(e.data), { runId, lastLine, lastOutputAt } = event;
  const run = findRun(runId);
  if (run) { if (lastLine) run.lastLine = lastLine; if (lastOutputAt) run.lastOutputAt = lastOutputAt; if (typeof event.pty === 'boolean') run.pty = event.pty; }
  for (const el of document.querySelectorAll(`[data-live="${runId}"]`)) { el.textContent = lastLine || el.textContent; el.title = lastLine || el.title; const ago = el.parentElement && el.parentElement.querySelector('[data-ago]'); if (ago && lastOutputAt) ago.dataset.ago = lastOutputAt; }
  for (const tab of TERM.tabs) if (tab.id === runId) termReceive(tab, event);
});
es.addEventListener('agenttest', e => {
  const t = JSON.parse(e.data), a = SETTINGS?.agents.find(x => x.id === t.id);
  if (t.status !== 'running') { clearTimeout(pending); pending = setTimeout(() => refresh().then(termSync).catch(() => {}), 250); }
  if (!a) return;
  if (t.login) { a.login = t.login; const login = $('login-' + t.id); if (login) login.outerHTML = loginSettingsView(a); }
  if (t.scope !== a.testScope) return;
  a.test = t;
  const el = $('test-' + t.id); if (el) el.innerHTML = testLabel(t);
  const out = $('test-output-' + t.id); if (out) out.innerHTML = agentTestOutput(t);
});
load().then(termRender);
</script>
</body>
</html>
