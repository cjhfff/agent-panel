<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 统筹面板</title>
<style>
  :root {
    /* 仪表盘配色：瓷白面板 + 钴蓝操作 + 指示灯 */
    --bg: #eef1f5; --panel: #fbfcfe; --sub: #f3f5f9; --line: #dde2ea; --line-strong: #c9d0db;
    --text: #141b26; --muted: #5b6678; --faint: #8a94a6;
    --accent: #3048d8; --accent-2: #4a63ee; --accent-weak: #e9edfd; --accent-ring: rgba(48,72,216,.28);
    --ok: #15996a; --warn: #e39a1f; --bad: #e5484d; --grid: #cfd6e1;
    --shadow-sm: 0 1px 2px rgba(20,27,38,.05); --shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 1px 2px rgba(20,27,38,.05), 0 10px 28px -14px rgba(20,27,38,.18);
    --font-ui: "Segoe UI Variable Text", "Segoe UI", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, ui-monospace, monospace;
    --claude: #c2410c; --codex: #0f766e; --gemini: #2563eb; --grok: #3d4656; --deepseek: #4f46e5;
    --t-start: #15996a; --t-agent: #3048d8; --t-dev: #7a5af8; --t-human: #e39a1f; --t-end: #5b6678;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1218; --panel: #161c25; --sub: #121821; --line: #253040; --line-strong: #33415a;
      --text: #e6eaf0; --muted: #8b96a8; --faint: #66728a;
      --accent: #6e86ff; --accent-2: #8a9dff; --accent-weak: #1a2340; --accent-ring: rgba(110,134,255,.32);
      --ok: #33c48d; --warn: #f2b04a; --bad: #ff6b6f; --grid: #222c3a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35); --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.6);
      --claude: #fb923c; --codex: #2dd4bf; --gemini: #60a5fa; --grok: #cbd5e1; --deepseek: #a5b4fc; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 76px 1fr; grid-template-rows: 52px 1fr; }
  input, select, button, textarea { font: inherit; color: inherit; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  textarea { width: 100%; resize: vertical; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { color: var(--ok); } button.bad { color: var(--bad); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); }
  button.ghost { border-color: transparent; background: none; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .grow { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  .chip.ok { color: var(--ok); border-color: var(--ok); } .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.bad { color: var(--bad); border-color: var(--bad); } .chip.run { color: var(--accent); border-color: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .pulse { animation: pulse 1.2s infinite; } @keyframes pulse { 50% { opacity: .35; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .clamp2.open { display: block; }
  details.more > summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; margin-top: 6px; }
  details.more > summary::before { content: '▸ '; } details.more[open] > summary::before { content: '▾ '; }
  .agent-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
  .story .top { display: flex; gap: 8px; align-items: flex-start; }
  .story .num { font-size: 12px; color: var(--muted); padding-top: 1px; }
  .owner { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }

  /* 框架 */
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; display: flex; gap: 8px; align-items: center; }
  header h1 .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #7a5af8); color: #fff; display: grid; place-items: center; font-size: 14px; }
  nav { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
  nav button { width: 64px; border: 0; background: none; padding: 8px 0; border-radius: 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
  nav button .i { font-size: 18px; line-height: 1; }
  nav button.on { background: var(--accent-weak); color: var(--accent); }
  main { overflow: auto; position: relative; }
  .page { padding: 16px 20px 40px; display: grid; gap: 14px; max-width: 1600px; }

  /* 画布 */
  .wf { position: absolute; inset: 0; display: grid; grid-template-rows: 48px 1fr; }
  .wf-bar { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .canvas { position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 20px 20px; cursor: grab; }
  .canvas.panning { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  .edges path.e { fill: none; stroke: #98a2b3; stroke-width: 2; }
  .edges path.e.sel { stroke: var(--accent); stroke-width: 3; }
  .edges path.e.live { stroke: var(--accent); stroke-dasharray: 6 4; animation: dash 1s linear infinite; }
  .edges path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .node { position: absolute; width: 230px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.08); cursor: pointer; user-select: none; }
  .node:hover { box-shadow: 0 4px 12px rgba(16,24,40,.12); }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .node.s-running { border-color: var(--accent); } .node.s-waiting { border-color: var(--warn); } .node.s-failed { border-color: var(--bad); } .node.s-done { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .node .nh { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .node .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; flex: none; background: var(--tc); }
  .node .tt { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .nb { padding: 0 12px 10px; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .node .nb .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .h { position: absolute; top: 19px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
  .node .h.in { left: -8px; } .node .h.out { right: -8px; cursor: crosshair; }
  .node .h.out:hover { background: var(--accent); }
  .zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; }
  .menu { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(16,24,40,.15); padding: 6px; min-width: 220px; }
  .menu div { padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; } .menu div:hover { background: var(--accent-weak); }
  .menu .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 12px; background: var(--tc); }

  /* 右侧节点面板 */
  /* Story 流程（泳道） */
  .flow { overflow: auto; padding: 14px 18px 60px; }
  .flow-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .lane { display: grid; grid-template-columns: 290px 1fr; gap: 14px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; transition: box-shadow .18s; }
  .lane:hover { box-shadow: 0 4px 14px rgba(16,24,40,.07); }
  .lane.rw { border-left: 3px solid var(--bad); }
  .lane-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .lane-head .ttl { flex-basis: 100%; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-head .num { font-size: 12px; color: var(--muted); }
  .lane-track { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 4px 2px 6px; }
  .ev { display: inline-flex; flex-direction: column; gap: 1px; padding: 5px 10px; border-radius: 10px; border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); background: var(--sub); white-space: nowrap; font-size: 12px; flex: none; transition: box-shadow .15s, transform .15s; }
  .ev[data-run] { cursor: pointer; } .ev[data-run]:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(16,24,40,.12); }
  .ev .t { font-weight: 600; } .ev .s { color: var(--muted); font-size: 11px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .ev.bad { background: color-mix(in srgb, var(--bad) 9%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); border-left-color: var(--bad); }
  .ev.ok { background: color-mix(in srgb, var(--ok) 9%, var(--panel)); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); border-left-color: var(--ok); }
  .ev.warn { background: color-mix(in srgb, var(--warn) 9%, var(--panel)); border-left-color: var(--warn); }
  .ev.run { animation: glow 1.8s ease-in-out infinite; }
  .ev.new { animation: chipIn .3s cubic-bezier(.2,.8,.2,1) both; }
  .ev.new.run { animation: chipIn .3s cubic-bezier(.2,.8,.2,1) both, glow 1.8s ease-in-out .3s infinite; }
  @keyframes chipIn { from { opacity: 0; transform: translateX(-8px) scale(.96); } }
  .arr { color: var(--muted); font-size: 13px; padding: 0 1px; flex: none; }
  .arr.loop { color: var(--bad); font-weight: 700; font-size: 16px; animation: spinIn .5s ease-out both; }
  @keyframes spinIn { from { transform: rotate(-180deg); opacity: 0; } }
  .badge-r { display: inline-grid; place-items: center; min-width: 18px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; padding: 0 5px; margin-left: 4px; }
  .mini { font-size: 12px; display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .mini .ic2 { letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side { position: absolute; top: 48px; right: 0; bottom: 0; width: 400px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; box-shadow: -8px 0 24px rgba(16,24,40,.06); overflow-wrap: anywhere; }
  .side .sb > * { min-width: 0; }
  .side .sh { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .side .sb { padding: 14px 16px; display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; } .field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .skills-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .skills-chips .chip { color: var(--text); }
  .runbox { background: var(--sub); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; }
  .liveline { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 看板 */
  .agents { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .agent { border-left: 4px solid var(--c); padding: 10px 12px; } .agent .name { font-weight: 600; color: var(--c); }
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .col { background: var(--sub); border-radius: 12px; padding: 8px; min-height: 120px; }
  .col h3 { font-size: 13px; margin: 2px 4px 8px; color: var(--muted); display: flex; justify-content: space-between; }
  .story { margin-bottom: 8px; padding: 10px; border-left: 3px solid var(--c, var(--line)); }
  .story .title { font-weight: 600; margin: 2px 0 6px; } .story select { width: 100%; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .box { font-size: 12px; margin-top: 6px; background: var(--sub); border-radius: 8px; padding: 6px 8px; }
  .files button { display: block; text-align: left; font: 12px ui-monospace, Consolas, monospace; }

  /* 技能库 */
  .sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .sk { display: grid; gap: 6px; align-content: start; }
  .sk .nm { font-weight: 600; } .sk .ds { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; } .tabs button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }
  .pick-list { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .pick-list label { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .pick-list label:hover { background: var(--accent-weak); }

  /* 通用 */
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 4px; } .md h3 { font-size: 15px; }
  .md table { border-collapse: collapse; margin: 8px 0; } .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
  .md code { background: var(--sub); padding: 0 4px; border-radius: 4px; font-size: 12px; } .md pre { background: var(--sub); padding: 10px; border-radius: 8px; overflow: auto; } .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  table.list { width: 100%; border-collapse: collapse; font-size: 12px; } table.list td, table.list th { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
  .st-running { color: var(--accent); } .st-finished { color: var(--ok); } .st-failed { color: var(--bad); } .st-cancelled, .st-queued { color: var(--muted); }
  /* 网页终端 */
  .term { position: fixed; left: 76px; right: 0; bottom: 0; height: 44vh; background: #0d1117; color: #c9d1d9; border-top: 1px solid #30363d;
    box-shadow: 0 -16px 40px rgba(0,0,0,.28); transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.8,.2,1), height .25s ease; z-index: 15;
    display: grid; grid-template-rows: 38px 1fr 28px; font: 12.5px/1.6 "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .term.open { transform: translateY(0); } .term.max { height: 82vh; }
  body.term-open main { padding-bottom: 44vh; }
  .term-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: #161b22; border-bottom: 1px solid #30363d; overflow-x: auto; font: 12px system-ui, "Microsoft YaHei", sans-serif; }
  .term-tab { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px 8px 0 0; color: #8b949e; cursor: pointer; white-space: nowrap; transition: background .18s, color .18s; position: relative; }
  .term-tab:hover { color: #e6edf3; } .term-tab.on { background: #0d1117; color: #e6edf3; }
  .term-tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--tc, #58a6ff); }
  .term-tab .x { opacity: 0; transition: opacity .15s; padding: 0 2px; } .term-tab:hover .x { opacity: .6; } .term-tab .x:hover { opacity: 1; }
  .term-tab .st { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; }
  .term-tab .st.run { background: #3fb950; box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: ping 1.6s infinite; }
  .term-tab .st.ok { background: #3fb950; } .term-tab .st.bad { background: #f85149; }
  .term-tab.flash { animation: tabflash .9s ease 2; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.55); } 70% { box-shadow: 0 0 0 7px rgba(63,185,80,0); } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); } }
  @keyframes tabflash { 50% { background: rgba(88,166,255,.25); } }
  .term-tools { margin-left: auto; display: flex; gap: 4px; padding-bottom: 5px; }
  .term-tools button { background: none; border: 0; color: #8b949e; padding: 3px 8px; border-radius: 6px; } .term-tools button:hover { background: #21262d; color: #e6edf3; }
  .term-body { overflow: auto; padding: 10px 16px 18px; position: relative; }
  .term-body .tb { display: none; } .term-body .tb.on { display: block; }
  .tl { white-space: pre-wrap; word-break: break-word; animation: tlIn .2s ease-out both; }
  @keyframes tlIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .tl.cmd { color: #79c0ff; margin-top: 6px; } .tl.cmd::before { content: '❯ '; color: #3fb950; font-weight: 700; }
  .tl.hdr { color: #d2a8ff; font-weight: 600; margin-top: 10px; } .tl.say { color: #f0f6fc; }
  .tl.ok { color: #3fb950; } .tl.err { color: #ff7b72; } .tl.add { color: #7ee787; } .tl.del { color: #ffa198; } .tl.warn { color: #e3b341; } .tl.dim { color: #6e7681; }
  .tl.launch { color: #8b949e; border-bottom: 1px dashed #30363d; padding-bottom: 8px; margin-bottom: 6px; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: #c9d1d9; vertical-align: -3px; margin-left: 2px; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .term-foot { display: flex; gap: 14px; align-items: center; padding: 0 14px; background: #161b22; border-top: 1px solid #30363d; color: #8b949e; font: 11.5px system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; white-space: nowrap; }
  .term-foot .cmdline { overflow: hidden; text-overflow: ellipsis; font-family: Consolas, ui-monospace, monospace; }
  .term-empty { color: #6e7681; padding: 30px; text-align: center; font-family: system-ui; }
  .jump { position: absolute; right: 18px; bottom: 12px; background: #1f6feb; color: #fff; border: 0; border-radius: 999px; padding: 4px 12px; font: 12px system-ui; box-shadow: 0 4px 12px rgba(0,0,0,.3); animation: tlIn .2s ease-out; }
  #termBtn .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; margin-left: 4px; padding: 0 5px; }
  /* 动效 */
  .page.enter { animation: fadeUp .26s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .node { transition: box-shadow .2s, border-color .2s, transform .15s; }
  .node.s-running { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 1px 3px rgba(16,24,40,.08); } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), 0 8px 22px rgba(21,94,239,.16); } }
  .card.story { transition: transform .16s ease, box-shadow .16s ease; } .card.story:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16,24,40,.08); }
  .card.story.running { animation: glow 1.8s ease-in-out infinite; }
  .chip, .seg button, nav button, button { transition: background .18s, color .18s, border-color .18s, box-shadow .18s; }

// ================= 工作流画布 =================
let view = { x: 40, y: 40, k: 1 }, graphDirty = false, saveTimer = null, drag = null;
// Story 流程（时间线）数据：/api/timeline；面板还没加载新接口时为 'unavailable'
let wfView = localStorage.getItem('wfView') || 'canvas', TL = null, tlAt = 0, tlBusy = null, tlOnlyRework = false;
const seenChips = new Set();
async function loadTimeline(force) {

  tlBusy = fetch('/api/timeline').then(r => r.ok ? r.json() : 'unavailable').catch(() => 'unavailable').then(x => { TL = x; tlBusy = null; return x; });

const tlList = () => Array.isArray(TL) ? TL : [];

function renderWfBar() {

window.runWorkflow = async () => { await saveGraphNow(); if (!S.leader && W.graph.nodes.some(n => n.type === 'agent' && (!n.config || !n.config.agent || n.config.agent === 'leader'))) return toast('先在右上角选 leader'); await api('/api/workflow/run', {}); refresh(); };

window.zoomBy = f => { const c = $('canvas').getBoundingClientRect(); zoomAt(c.width / 2, c.height / 2, f); };
function zoomAt(cx, cy, f) { const k = Math.min(2, Math.max(.3, view.k * f)); view.x = cx - (cx - view.x) * k / view.k; view.y = cy - (cy - view.y) * k / view.k; view.k = k; applyView(); }

  const ns = W.graph.nodes; if (!ns.length) return;
  const c = $('canvas').getBoundingClientRect(), minX = Math.min(...ns.map(n => n.x)), minY = Math.min(...ns.map(n => n.y)), maxX = Math.max(...ns.map(n => n.x + 230)), maxY = Math.max(...ns.map(n => n.y + 120));
  const k = Math.min(1.2, Math.max(.3, Math.min((c.width - (sel ? 460 : 60)) / (maxX - minX), (c.height - 60) / (maxY - minY))));

// 一个事件 → 一个 chip
function evChip(e, s, reworkNo) {
  const dur = e.t && e.end ? fmtDur(Date.parse(e.end) - Date.parse(e.t)) : '';
  const running = ['running', 'queued'].includes(e.status);
  const who = e.agent ? agentName(e.agent) : '';
  let t = '', sub = '', cls = '', tip = e.note || '';
  if (e.type === 'impl') { t = reworkNo ? `↺ 返工 #${reworkNo}` : '🛠 实现'; sub = [who, running ? (e.status === 'queued' ? '排队' : '进行中') : dur, e.blocked ? '阻塞' : '', e.status === 'failed' ? '失败' : ''].filter(Boolean).join(' · '); cls = e.status === 'failed' ? 'bad' : e.blocked ? 'warn' : ''; }
  else if (e.type === 'qa') { t = '🔍 交叉验收'; sub = [who, e.total != null ? `${e.pass}/${e.total} 条通过` : (running ? '进行中' : dur)].filter(Boolean).join(' · '); cls = e.total != null && e.pass < e.total ? 'warn' : e.status === 'failed' ? 'bad' : ''; }
  else if (e.type === 'task') { t = '🧩 临时任务'; sub = [who, running ? '进行中' : dur].filter(Boolean).join(' · '); tip = (e.title || '') + (e.note ? '\n' + e.note : ''); }
  else if (e.type === 'review') { t = '⚖ 评审'; sub = [who, e.verdict === 'approve' ? '建议通过' : e.verdict === 'changes' ? '建议修改' : running ? '进行中' : ''].filter(Boolean).join(' · '); cls = e.verdict === 'changes' ? 'warn' : ''; }
  else if (e.type === 'reject') { t = '✗ 打回'; sub = (e.note || '').replace(/\s+/g, ' ').slice(0, 26) || 'Leader 打回'; cls = 'bad'; }
  else if (e.type === 'accept') { t = '✓ 验收通过'; sub = e.evidence ? `证据 ${e.evidence} 条` : 'Leader'; cls = 'ok'; }
  else if (e.type === 'denied') { t = '⛔ 被面板拦下'; sub = (e.note || '').slice(0, 26); cls = 'warn'; }

}

const TERM = { open: false, max: false, tabs: [], active: null };
const termShort = t => { const m = t.match(/-Command\s+(["'])([\s\S]*)\1\s+in\s+\S+\s*$/); let c = m ? m[2] : t.replace(/\s+in\s+[A-Za-z]:\\\S*\s*$/, ''); c = c.replace(/^"?[A-Za-z]:\\[^"]*?powershell\.exe"?\s*/i, '').replace(/\\"/g, '"'); return /^-Command\s/.test(c) ? c.replace(/^-Command\s+/, '') : c; };
function termTabLabel(r) { const tgt = r.storyKey ? 'Story ' + shortKey(r.storyKey) : r.nodeId ? ((W && W.graph.nodes.find(n => n.id === r.nodeId) || {}).title || r.nodeId) : r.title || ''; return `${agentName(r.agent)} · ${KIND[r.kind] || r.kind}${tgt ? ' · ' + tgt : ''}`; }
function termLine(tab, text, cls) {
  const div = document.createElement('div'); div.className = 'tl ' + (cls || ''); div.textContent = text;
  const body = $('termBody'), atEnd = body.scrollTop + body.clientHeight >= body.scrollHeight - 60;

}
function termClassify(tab, raw) {
  const t = raw.replace(/\s+$/, ''), s = t.trim();
  if (!s) return;
  if (tab.first) { tab.first = false; if (s.startsWith('$ ')) { tab.cmdline = s.slice(2); return termLine(tab, s, 'launch'); } }
  if (/^-{4,}$|^={4,}$|^(OpenAI Codex|workdir|model|provider|approval|sandbox|reasoning|session id)/i.test(s)) return termLine(tab, t, 'dim');
  if (s === 'codex') { tab.mode = 'say'; return termLine(tab, '💬 ' + agentName(tab.run.agent), 'hdr'); }
  if (s === 'user') { tab.mode = 'user'; return termLine(tab, '📋 任务', 'hdr'); }
  if (s === 'thinking') { tab.mode = 'think'; return termLine(tab, '🤔 思考', 'hdr'); }
  if (s === 'exec') { tab.mode = 'exec'; tab.expectCmd = true; return; }
  if (s === 'tokens used') { tab.mode = 'tail'; return termLine(tab, '— tokens used —', 'dim'); }
  if (tab.expectCmd) { tab.expectCmd = false; return termLine(tab, termShort(s), 'cmd'); }
  let m;
  if ((m = s.match(/^succeeded in (\d+)ms/))) return termLine(tab, `✓ 成功 · ${m[1]}ms`, 'ok');
  if ((m = s.match(/^exited (-?\d+) in (\d+)ms/))) return termLine(tab, `${m[1] === '0' ? '✓' : '✗'} 退出码 ${m[1]} · ${m[2]}ms`, m[1] === '0' ? 'ok' : 'err');
  if (/^\[exit (\d+)\]/.test(s)) return termLine(tab, s, /\[exit 0\]/.test(s) ? 'ok' : 'err');
  if (/^(diff --git|index [0-9a-f]|@@|\+\+\+|---\s)/.test(s)) return termLine(tab, t, 'dim');
  if (tab.mode === 'exec' && /^\+/.test(t)) return termLine(tab, t, 'add');
  if (tab.mode === 'exec' && /^-/.test(t)) return termLine(tab, t, 'del');
  if (/^warning|WARN/i.test(s)) return termLine(tab, t, 'warn');
  if (/(^|\s)(ERROR|Error:|not ok|FAIL|failed)\b/.test(s)) return termLine(tab, t, 'err');
  if (tab.mode === 'say' || tab.mode === null) return termLine(tab, t, 'say');

function termFeed(tab, text) {

  for (const l of lines) termClassify(tab, l);

  if (tab.buf.length > 0 && (tab.mode === null || tab.mode === 'say')) {
    const parts = tab.buf.split(/(?<=[。！？!?])/);

window.doSetup = async dir => { await api('/api/project/setup', { path: dir, template: $('suTpl').value }); watchSetup(dir, () => { $('dlg').close(); load(); toast('BMAD 已装好', 'ok'); }); };
window.pickFolder = (cb, openMode) => {
  let cur = openMode ? (S.project || S.projectsRoot) : $('npParent') ? $('npParent').value : '';
  const prevBody = $('dlg').open ? $('dlgBody').innerHTML : null, prevTitle = $('dlgTitle').textContent;
  const prevVals = {}; if (prevBody !== null) for (const el of $('dlgBody').querySelectorAll('input[id],select[id],textarea[id]')) prevVals[el.id] = el.value;
  const draw = async p => {
    const d = await api('/api/fs' + q({ path: p || '' })); cur = d.path;
    dialog(openMode ? '打开项目文件夹' : '选择文件夹', `<div class="form"><div class="row"><input id="fsPath" class="grow" value="${esc(d.path)}"><button onclick="fsGo($('fsPath').value)">前往</button></div>
      <div class="fs-list">${d.parent !== null ? `<div onclick="fsGo('${jsq(d.parent || '')}')">⬆ 上一级</div>` : ''}${d.dirs.map(x => `<div onclick="fsGo('${jsq(x)}')">📁 ${esc(x.split(/[\\/]/).filter(Boolean).pop() || x)}</div>`).join('') || '<div class="muted">（没有子文件夹）</div>'}</div>
      <div class="row">${d.isBmad ? '<span class="chip ok">已装 BMAD</span>' : ''}<span class="grow"></span><button class="primary" ${d.path ? '' : 'disabled'} onclick="fsPick()">选这个文件夹</button></div></div>`, true);
  };
  window.fsGo = draw;
  window.fsPick = () => {
    if (prevBody !== null && !openMode) { dialog(prevTitle, prevBody, true); for (const [k, v] of Object.entries(prevVals)) if ($(k)) $(k).value = v; }
    cb(cur);
  };
  draw(cur);
};
$('projectSel').onchange = e => {
  const v = e.target.value;
  if (v === '__new' || v === '__open') { renderTop(); return v === '__new' ? newProjectDialog() : openProjectDialog(); }
  api('/api/project/open', { project: e.target.value }).then(r => { if (r.needsSetup) setupDialog(r.path); else { sel = null; SKILLS = null; load(); } });
};
$('modeSeg').onclick = async e => {
  const m = e.target.dataset.m; if (!m || m === S.mode) return;
  if (m === 'auto' && !S.leader) return toast('先选 leader');
  S = await api('/api/mode', { mode: m }); toast(m === 'leader' ? '已切到 Leader 统筹：Leader 每次被唤醒都会看全局，自己决定下一步' : m === 'auto' ? `已切到规则自动：按依赖派发，Leader 逐个评审（最多打回 ${S.maxRounds} 轮）` : '已切到手动模式：每步等你确认', 'ok'); if (m === 'leader') goPage('leader'); else refresh();
};
$('leader').onchange = e => api('/api/leader', { agent: e.target.value }).then(x => { S = x; renderTop(); if (page === 'workflow') { drawNodes(); renderSide(); } });

// ---- 设置 ----
async function openSettings() {
  const list = await api('/api/agents');
  dialog('设置', `<div class="form">
    <div class="grid2"><label>同时运行的任务数<select id="setPar" title="同时跑的任务数。Leader 会保证同时跑的任务不改同一批文件">${[1, 2, 3, 4, 5].map(n => `<option ${S.maxParallel === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>自动模式最多打回几轮<select id="setRounds" onchange="api('/api/mode',{maxRounds:+this.value}).then(x=>{S=x;toast('已保存','ok')})">${[1, 2, 3, 4, 5].map(n => `<option ${S.maxRounds === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>新项目默认放在<div class="row"><input id="setRoot" class="grow" value="${esc(S.projectsRoot)}"><button onclick="saveGlobal()">保存</button></div></label></div>
    ${list.map(settingsCard).join('')}</div>`);
}
window.openSettings = openSettings;
function settingsCard(a) {
  const t = a.test;
  return `<div class="card settings-agent" style="--c:${color(a.id)}" id="set-${a.id}">
    <div class="row"><b style="color:${color(a.id)}">${esc(a.name)}</b><span class="chip ${a.installed ? 'ok' : 'bad'}">${a.installed ? '已安装' : '未安装'}</span>
      <label class="row small"><input type="checkbox" id="en-${a.id}" ${a.enabled ? 'checked' : ''}> 启用</label><span class="grow"></span>
      <span class="small" id="test-${a.id}">${testLabel(t)}</span><button ${a.installed ? '' : 'disabled'} onclick="testAgent('${a.id}')">测连通</button></div>
    <div class="small muted">${esc(a.path || a.cmd)}</div>
    <div class="grid2" style="margin-top:8px">
      <label>权限<select id="perm-${a.id}">${a.permOptions.map(o => `<option value="${o}" ${a.permission === o ? 'selected' : ''}>${o === 'max' ? '最高（无审批、无沙箱，测试电脑用）' : '标准（自动改文件，危险命令拦截）'}</option>`).join('')}</select></label>
      <label>模型${a.canModel ? `<div class="row"><input id="model-${a.id}" class="grow" list="ml-${a.id}" value="${esc(a.model || '')}" placeholder="留空用默认">${a.baseUrl ? `<button onclick="loadModels('${a.id}')">拉取列表</button>` : ''}</div><datalist id="ml-${a.id}"></datalist>` : `<div class="small muted">${esc(a.modelNote || '在 agent 自己的配置里改')}</div>`}</label></div>
    ${a.baseUrl ? `<div class="grid2" style="margin-top:8px"><label>中转站<div class="small">${esc(a.relay || '')}<br><code>${esc(a.baseUrl)}</code></div></label>
      <label>Key（${esc(a.keyName)}：${esc(a.keyMasked || '未设置')}）<div class="row"><input id="key-${a.id}" class="grow" type="password" placeholder="粘贴新 key 替换" autocomplete="off"><button onclick="saveKey('${a.id}')">替换</button></div></label></div>` : ''}
    <label style="margin-top:8px">特长（leader 分配时参考）<input id="str-${a.id}" value="${esc(a.strengths || '')}"></label>
    <div class="row" style="margin-top:8px"><span class="grow"></span><button class="primary" onclick="saveAgent('${a.id}', ${a.canModel})">保存</button></div>
    ${t && t.output && t.status !== 'ok' ? `<details><summary class="small">测连通输出</summary><pre class="log">${esc(t.output)}</pre></details>` : ''}</div>`;
}
const testLabel = t => !t ? '' : t.status === 'running' ? '<span class="pulse">测试中…</span>' : t.status === 'ok' ? `<span style="color:var(--ok)">✓ 通 · ${fmtDur(t.ms)}</span>` : `<span style="color:var(--bad)">✗ ${t.status === 'timeout' ? '超时' : '失败'}</span>`;
window.saveGlobal = () => api('/api/settings', { maxParallel: +$('setPar').value, projectsRoot: $('setRoot').value.trim() }).then(x => { S = x; toast('已保存', 'ok'); });
window.saveAgent = async (id, canModel) => {
  const patch = { enabled: $('en-' + id).checked, permission: $('perm-' + id).value, strengths: $('str-' + id).value };
  if (canModel) patch.model = $('model-' + id).value.trim();
  await api('/api/agents/save', { id, patch }); toast('已保存', 'ok'); S = await api('/api/state'); renderTop();
};
window.saveKey = async id => { const v = $('key-' + id).value.trim(); if (!v) return toast('先粘贴 key'); await api('/api/agents/secret', { id, value: v }); toast('key 已替换', 'ok'); openSettings(); };
window.testAgent = async id => { await api('/api/agents/test', { id }); $('test-' + id).innerHTML = testLabel({ status: 'running' }); };
window.loadModels = async id => { const ms = await api('/api/agents/models' + q({ id })); $('ml-' + id).innerHTML = ms.map(m => `<option value="${esc(m)}">`).join(''); toast(`可用模型：${ms.join('、')}`, 'ok'); $('model-' + id).focus(); };

// ================= 实时更新 =================
const es = new EventSource('/api/events');
let pending = null;
es.addEventListener('state', () => { clearTimeout(pending); pending = setTimeout(() => refresh().then(termSync).catch(() => {}), 250); });
es.addEventListener('log', e => {
  const { runId, text, lastLine } = JSON.parse(e.data);
  for (const el of document.querySelectorAll(`[data-live="${runId}"]`)) { el.textContent = lastLine || el.textContent; const ago = el.parentElement && el.parentElement.querySelector('[data-ago]'); if (ago && JSON.parse(e.data).lastOutputAt) ago.dataset.ago = JSON.parse(e.data).lastOutputAt; }
  for (const t of TERM.tabs) if (t.id === runId) { if (t.loaded) termFeed(t, text); else t.pending.push(text); }
  if ($('dlg').open && logRun === runId) { const pre = $('logPre'), b = $('dlgBody'), atEnd = b.scrollTop + b.clientHeight >= b.scrollHeight - 40; pre.textContent += text.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '').replace(/([。！？])(?=\S)/g, '$1\n'); if (atEnd) b.scrollTop = 1e9; }
});
es.addEventListener('agenttest', e => { const t = JSON.parse(e.data); const el = $('test-' + t.id); if (el) el.innerHTML = testLabel(t); if (t.status !== 'running' && $('set-' + t.id)) openSettings(); });
load().then(termRender);
</script>
</body>
</html>
